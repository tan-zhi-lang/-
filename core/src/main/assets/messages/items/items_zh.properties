items.涂药.激素药物.name=激素药物
items.涂药.激素药物.desc=这件装备上涂着一种由速行蓟制成的药物。接触者短暂降低其移动速度。

items.涂药.致盲药物.name=致盲药物
items.涂药.致盲药物.desc=这件装备上涂着一种由致盲草制成的药物，能让接触者失明一小段时间。药效比新鲜的致盲草弱，不会让目标迷失方向，所以目标会记住你之前在的位置。

items.涂药.寒霜药物.name=寒霜药物
items.涂药.寒霜药物.desc=这件装备上涂着一种由冰冠花制成的药物，能显著地冻僵接触者。

