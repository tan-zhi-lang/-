items.potions.elixirs.玄武秘药.name=玄武秘药
items.potions.elixirs.玄武秘药.desc=+5最大护甲和+2最大防御。

items.potions.elixirs.血怒秘药.name=血怒秘药
items.potions.elixirs.血怒秘药.desc=+0.5%全能吸血和15%暴击伤害。

items.potions.elixirs.圣魄秘药.name=圣魄秘药
