###trinkets
items.trinkets.crackedspyglass.name=幻象裂镜
items.trinkets.crackedspyglass.typical_stats_desc=这件禁忌物通常会有_%1$s%%_的概率在除Boss层以外的每层额外生成一件隐藏物品
items.trinkets.crackedspyglass.stats_desc=有_%1$s%%_的概率在除Boss层以外的每层额外生成一件隐藏物品。
items.trinkets.crackedspyglass.stats_desc_upgraded=有_100%%_的概率在除Boss层以外的每层额外生成一件隐藏物品，并有_%1$s%%_的概率生成第二件额外隐藏物品。

items.trinkets.chaoticcenser.name=混沌香炉
items.trinkets.chaoticcenser.spew=你的香炉将要喷出：%s。
items.trinkets.chaoticcenser.stats_desc=每经_%s_±回合在敌人附近生成一团有害气体。气体只会在敌人存在时生成。禁忌物的等级越高，稀有而强力的气体生成的可能性越高。

items.trinkets.dimensionalsundial.name=位面日晷
items.trinkets.dimensionalsundial.warning=你的日晷不再显影，这使你倍感不安。
items.trinkets.dimensionalsundial.stats_desc=在昼间(8:00~20:00)降低_%1$s%%_的刷怪速度并在夜间(20:00~8:00)提升_%2$s%%_的刷怪速度。

items.trinkets.exoticcrystals.name=奇异能晶
items.trinkets.exoticcrystals.stats_desc=使_%s%%_的药剂、卷轴转化为其对应的合剂、秘卷。转化不会影响潜力药剂，升级卷轴与为解决特殊房间提供帮助而生成的物品。

items.trinkets.eyeofnewt.name=蝾螈魔眼
items.trinkets.eyeofnewt.stats_desc=降低你_%1$s%%_的视距，但也会使你获得对_%2$d_格范围内敌人的灵视感知。

items.trinkets.ferrettuft.name=雪貂绒束
items.trinkets.ferrettuft.stats_desc=提升所有单位 _%1$s%%_的闪避。

items.trinkets.mimictooth.name=拟箱利齿
items.trinkets.mimictooth.stats_desc=使所有类型的宝箱怪的出现频率变为原频率的_%1$s倍_，并使宝箱怪更难以识别，而其掉落的战利品也会更加丰厚。此外，每层地牢还会有_%2$s%%_的概率额外带有一个隐藏的黑檀宝箱怪。

items.trinkets.mossyclump.name=苔藓丛簇

items.trinkets.mossyclump.stats_desc=使_%s%%_的无氛围楼层获得流水或草木氛围。\n\n这件禁忌物升级所消耗的能量较多。

items.trinkets.parchmentscrap.name=残魔余卷
items.trinkets.parchmentscrap.stats_desc=使附魔与刻印的出现频率变为原频率的_%s倍_，而武器与护甲的诅咒的出现频率变为原频率的_%s倍_。法杖、戒指与神器的诅咒不受影响。\n\n这件禁忌物升级所消耗的能量较多。

items.trinkets.petrifiedseed.name=石化种子
items.trinkets.petrifiedseed.stats_desc=有_%1$s%%_的概率使被践踏的高草掉落符石而非种子，还会使高草掉落物品的概率提升_%2$s%%_。

items.trinkets.巨鼠头骨.name=巨鼠头骨
items.trinkets.巨鼠头骨.stats_desc=使稀有敌人的出现频率变为_%s倍_。但是对水晶宝箱怪与装甲石像为_%s倍_。

items.trinkets.saltcube.name=盐晶立方

items.trinkets.saltcube.stats_desc=饥饿速度减少_%1$s%%_，但生命再生速度增加_%2$s%%_，若楼层封锁则无效。

items.trinkets.shardofoblivion.name=遗忘碎片
items.trinkets.shardofoblivion.stats_desc=根据你已经装备或最近使用的每件(最多_%s件_)未鉴定装备提升20%%的敌人掉落战利品的概率。碎片还会阻止你鉴定装备，你只能通过碎片手动鉴定符合鉴定条件的装备。
items.trinkets.shardofoblivion.ac_identify=鉴定
items.trinkets.shardofoblivion.identify_prompt=鉴定一件物品
items.trinkets.shardofoblivion.identify_ready=可鉴定物品：%s。使用遗忘碎片以将其鉴定。
items.trinkets.shardofoblivion.identify_ready_worn=你物品已符合鉴定条件。对其使用遗忘碎片以将其鉴定。
items.trinkets.shardofoblivion.identify_not_yet=这件物品尚未符合鉴定条件。
items.trinkets.shardofoblivion.identify=你鉴定了这个物品！
items.trinkets.shardofoblivion$wandusetracker.name=未鉴定法杖已使用
items.trinkets.shardofoblivion$wandusetracker.desc=你近期已使用一根未鉴定法杖，短期内遗忘碎片将其视为一件已使用的未鉴定装备。\n\n剩余回合数：%s
items.trinkets.shardofoblivion$thrownusetracker.name=未鉴定投掷武器已使用
items.trinkets.shardofoblivion$thrownusetracker.desc=你近期已使用一件未鉴定投掷武器，短期内遗忘碎片将其视为一件已使用的未鉴定装备。\n\n剩余回合数：%s

items.trinkets.thirteenleafclover.name=十三叶草
items.trinkets.thirteenleafclover.stats_desc=攻击_%1$s%%_概率造成最大攻击伤害，但是_%2$s%%_概率造成最小伤害。

items.trinkets.trapmechanism.name=陷阱元件
items.trinkets.trapmechanism.stats_desc=使_%1$s%%_的无氛围楼层获得陷阱或深渊氛围。此外，地牢中_%2$s%s%%_的隐藏陷阱会变得可见。

items.trinkets.vialofblood.name=凝血试管
items.trinkets.vialofblood.stats_desc=提升你从治疗药剂、水袋或生命之泉获得的治疗总量_%1$s%%_。但治疗速度也会更为迟滞，每回合最多回复_%2$s点_生命值(此数值会随着英雄等级的提升而提升)。

items.trinkets.wondrousresin.name=奇迹树脂
items.trinkets.wondrousresin.stats_desc=有_%1$s%%_的概率迫使诅咒法杖效果变得无害或有益，还会有_%2$s%%_的概率使无诅咒的法杖施放一次额外的无害或有益的诅咒法杖效果。\n\n这件禁忌物升级所消耗的能量较多。

items.trinkets.trinketcatalyst.name=魔能触媒
items.trinkets.trinketcatalyst.window_title=制作一件禁忌物
items.trinkets.trinketcatalyst.window_text=随着魔能触媒的置入，釜中的水逐渐泛起微光。你可以就近选择一件物品，注入能量并将其炼成一件魔法禁忌物。
items.trinkets.trinketcatalyst.desc=魔能触媒结合少许能量制成一件独特禁忌物。\n\n禁忌物提供各种小幅改变地牢环境或其住民的效果。通过消耗更多能量升级禁忌物可以进一步增幅对应效果，丢掉禁忌物也可以完全摆脱其施加的影响。
items.trinkets.trinketcatalyst$randomtrinket.name=随机禁忌物
items.trinkets.trinketcatalyst$randomtrinket.desc=就近的一件物品被塞进了一个你打不开的包裹内。\n\n炼金反应可以将包裹溶解，但是在得到禁忌物之前你可没法确定它到底是什么。

items.trinkets.中国国旗.name=中国国旗
items.trinkets.中国国旗.desc=它象征着中国道路的壮阔与艰辛——从积贫积弱到繁荣富强，这条复兴之路从不是坦途，却因无数人“遇山开路、遇水架桥”的不屈意志而越走越宽。正如徽章上交织的经纬纹路，既代表着前行中的“负重”，更彰显着中国人在逆境中“压不垮、打不倒”的精神内核：慢下来，是为了扎稳脚步；扛住了，才能走向更远的未来。佩戴它，便是将这份“以坚韧破万难”的信念刻入血脉，在每一步沉稳的前行中，续写属于新时代的奋斗华章。
items.trinkets.中国国旗.stats_desc=+%s%%物理抗性，但是移速仅%s%%。

