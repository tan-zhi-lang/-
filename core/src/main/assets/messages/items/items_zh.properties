items.arcaneresin.name=酶优树酯
items.arcaneresin.prompt=选择一根要强化的法器
items.arcaneresin.ac_apply=强化
items.arcaneresin.level_too_high=这根法杖过于强大，树脂已经不足以对其进行进一步强化了。
items.arcaneresin.not_enough=你的树脂不够了！
items.arcaneresin.apply=你将树脂包被于法器的表面。法器的能量愈发凝练了！
items.arcaneresin.desc2=这团细腻的粉末闪烁着紫与白的微光。酶优树酯可用于增强法杖魔能，提升法杖等级！\n\n基于法杖初始等级，升级一根法杖分别需要消耗1、2、3个树脂。树脂最多可以升级法杖至+3。\n\n然而，树脂的升级效果不但会_被其他升级来源覆盖_(例如升级卷轴)，而且无法通过灌注法杖转移到法师的魔杖。
items.arcaneresin.desc=酶优树酯可用于增强法器魔力收益，提升法器魔力收益10%！\n\n基于初始魔力收益，强化一个法器分别需要消耗1、2、3个等树脂。
items.arcaneresin.discover_hint=你可通过炼金合成该物品。

items.荣誉纹章.name=荣誉纹章
items.荣誉纹章.ac_affix=贴附
items.荣誉纹章.prompt=选择一件护甲。
items.荣誉纹章.unknown_armor=你需要先鉴定那件护甲有无诅咒。
items.荣誉纹章.cursed_armor=纹章不能贴附于被诅咒的盔甲。
items.荣誉纹章.affix=你将纹章佩挂在了护甲上！
items.荣誉纹章.desc=纹章可以被_贴附在护甲上_并能在护甲间转移。它能够携带升级以及刻印，前提是升级时纹章需已贴附在护甲上。
items.荣誉纹章.inscribed=纹章刻有_%s_。
items.荣誉纹章.choose_title=选择一个刻印
items.荣誉纹章.choose_desc=这件护甲与荣誉纹章均刻有刻印。请选择一个想保留的刻印。\n\n护甲刻印：%1$s\n荣誉纹章刻印：%2$s\n\n注意，如果选择保留护甲的刻印，纹章将无法转移该刻印。
items.荣誉纹章.discover_hint=某位英雄初始携带该物品。
items.荣誉纹章$warriorshield.name=战士护盾
items.荣誉纹章$warriorshield.desc_active=战士的荣誉纹章正使他变得不屈不挠，使其获得在生命值之上的护盾。在护盾首次触发后其可被再次使用之前护盾需要进行冷却。\n\n这种护盾并不会随时间衰减，但如果附近持续几回合没有敌人则护盾会结束。当其结束时，任何未使用的护盾都会降低护盾冷却，最多降低50%%。\n\n剩余护盾：%1$d\n\n当前冷却：%2$d

items.荣誉纹章$warriorshield.desc_negative_cooldown=战士护盾的冷却时间当前为负值，意味着当他的护盾生效时，冷却时间会比通常的150回合更低。护盾冷却可被减至最低-150回合，意味着护盾可在破碎时立即再生效一次。\n\n剩余冷却时间：%s

