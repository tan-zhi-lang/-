items.涂药.传送药物.name=传送药物
items.涂药.传送药物.desc=这件装备上涂着一种由消逝草制成的药物，能把接触者传送走一小段距离。

items.涂药.治疗药物.name=治疗药物
items.涂药.治疗药物.desc=这件装备上涂着一种由阳春草制成的药物，能强效自身的伤势。

items.涂药.神圣药物.name=神圣药物
items.涂药.神圣药物.desc=这件装备上涂着一种由星陨花制成的药物，能向亡灵或恶魔体内注入神圣能量受到大量伤害。

items.涂药.燃烧药物.name=燃烧药物
items.涂药.燃烧药物.desc=这件装备上涂着一种由烈焰花制成的药物，燃烧接触者。

items.涂药.麻痹药物.name=麻痹药物
items.涂药.麻痹药物.desc=这件装备上涂着一种由地缚根制成的药物，能让接触者无助地麻痹一小段时间。

items.涂药.毒液药物.name=毒液药物
items.涂药.毒液药物.desc=这件装备上涂着一种由断肠苔制成的药物，能使接触者中毒。

items.涂药.腐莓药物.name=腐莓药物
items.涂药.腐莓药物.desc=这种恶毒的药物上涂着一种由腐莓制成的酸蚀毒膏，能够蚀穿药物触及的任何事物。其上的蚀毒异常强大，寻常敌人触之即死，但强敌可消去其大半功效。相较于其他涂药药物，这类药物上的涂药药效更加耐用。

items.涂药.电击药物.name=电击药物
items.涂药.电击药物.desc=这件装备上涂着一种由风暴藤制成的药物，能让接触者受到强烈的电击。


