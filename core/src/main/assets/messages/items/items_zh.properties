items.wands.wandofblastwave.typical_stats_desc=这根法杖能射出在目标地点剧烈爆炸的魔法飞弹。爆炸的威力通常会造成_%s~%s伤害_，并强到足以炸飞大多数敌人。
items.wands.wandofblastwave.stats_desc=这根法杖能射出一股能量，在目标位置引发强烈的爆炸。爆炸的力量会造成_%s~%s伤害_并强到足以击飞大多数敌人。
items.wands.wandofblastwave.upgrade_stat_name_2=击退

items.wands.wandofcorrosion.name=酸蚀法杖
items.wands.wandofcorrosion.stats_desc=这根法杖能射出一颗会在目标位置爆炸成一团腐蚀酸雾的法球。进入酸雾的任何单位都会持续受到起始为_%s_的持续递增伤害。
items.wands.wandofcorrosion.upgrade_stat_name_1=气体总量

items.wands.浓毒法杖.name=酸蚀法杖
items.wands.浓毒法杖.stats_desc=这根法杖能射出一颗会在目标位置爆炸成一团毒气的法球。进入毒气的任何单位都会持续受到起始为_%s_的持续递增伤害。
items.wands.浓毒法杖.upgrade_stat_name_1=气体总量

items.wands.wandofcorruption.name=腐化法杖
items.wands.wandofcorruption.already_corrupted=这个角色已经被你腐化。
items.wands.wandofcorruption.stats_desc=这根法杖会释放腐坏的能量，能削弱敌人并最终将他们扭曲为你的奴仆。敌人能抵抗腐化，但虚弱的敌人明显地更容易被腐化。
items.wands.wandofcorruption.upgrade_stat_name_1=腐化强度
items.wands.wandofcorruption.upgrade_stat_name_2=减益持续时间

items.wands.wandofdisintegration.name=解离法杖
items.wands.wandofdisintegration.stats_desc=这根法杖射出的光束能穿透任何障碍物，同时会破坏一些东西，并将随着法杖等级的提升而射得更远。光束会造成_%s~%s伤害_，并且会根据穿透的地形和敌人数量造成额外伤害。

items.wands.影织法杖.name=影织法杖
items.wands.影织法杖.stats_desc=这根法杖在使用时会产生一股强大的影织，延伸出一个锥形区域。下一次使用它将消耗_%s充能_并造成_%s~%s伤害_。法杖一次消耗的充能数越多，其范围与威力就越大、越强。

items.wands.焰浪法杖.name=焰浪法杖
items.wands.焰浪法杖.stats_desc=这根法杖在使用时会产生一股强大的焰浪，延伸出一个锥形区域。下一次使用它将消耗_%s充能_并造成_%s~%s伤害_。法杖一次消耗的充能数越多，其范围与威力就越大、越强。

items.wands.冰海法杖.name=冰海法杖
items.wands.冰海法杖.stats_desc=这根法杖在使用时会产生一股强大的冰海，延伸出一个锥形区域。下一次使用它将消耗_%s充能_并造成_%s~%s伤害_。法杖一次消耗的充能数越多，其范围与威力就越大、越强。

items.wands.wandoffrost.name=冰霜法杖
items.wands.wandoffrost.stats_desc=这根法杖能向你的敌人射击冰霜能量，造成_%s~%s伤害_并冻僵目标，在水中的作用似乎更强。冻僵的敌人将会被该法杖冻结，冻结的敌人将受到更少该法杖的伤害。

items.wands.烈焰法杖.name=烈焰法杖
items.wands.烈焰法杖.stats_desc=这根法杖能向你的敌人射击烈焰能量，造成_%s~%s伤害_并燃烧目标，在草丛和门上面的作用似乎更强。燃烧的敌人将会被该法杖火毒，燃烧的敌人将受到更少该法杖的伤害。

items.wands.灵月法杖.name=灵月法杖
items.wands.灵月法杖.discover_hint=某位英雄初始携带该物品。

items.wands.wandoflightning.name=雷霆法杖
items.wands.wandoflightning.stats_desc=这根法杖能向任何瞄准的地方射出强大的电弧，造成_%s~%s伤害_，同时施加麻痹效果。这道闪电能在附近多个目标间跳跃，在水里会更强力。

items.wands.wandoflivingearth.name=灵壤法杖
items.wands.wandoflivingearth.stats_desc=这根法杖能向敌人发射魔法泥石，造成_%s~%s伤害_。泥石随后会回归使用者身边，根据造成的伤害重组成灵壤护甲。灵壤护甲积累到一定程度后，下次使用法杖时会成型为一尊灵壤守卫。
items.wands.wandoflivingearth.upgrade_stat_name_2=守卫最大生命值
items.wands.wandoflivingearth.upgrade_stat_name_3=守卫防御
items.wands.wandoflivingearth$rockarmor.name=灵壤护甲
items.wands.wandoflivingearth$rockarmor.desc=魔法泥石环绕在你身边，当你被攻击泥石会尽其所能进行格挡，从而为你抵消50%%所受伤害。不过，抵消伤害会消除一定量的泥石。\n\n剩余护甲量：%s\n\n当积攒的泥石达到一定程度时，下一次发动灵壤法杖会使泥石成型为一尊灵壤守卫为你而战。\n\n守卫成型所需护甲量：%s
items.wands.wandoflivingearth$rockarmor.desc_many=该灵壤守卫已被万物一心强化。剩余回合数：%s
items.wands.wandoflivingearth$earthguardian.name=灵壤守卫
items.wands.wandoflivingearth$earthguardian.desc=灵壤法杖发射的魔法泥石组成了一尊灵壤守卫！这个有棱有角的大块头会攻击附近的敌人，迫使他们去攻击守卫。当附近没有危险时，守卫会重组为你身边的灵壤护甲，等待你下次使用法杖召唤它。
items.wands.wandoflivingearth$earthguardian.wand_info=守卫的防御与你的法杖等级相关。它当前能抵挡_%s~%s伤害_。
items.wands.wandoflivingearth$earthguardian.discover_hint=你可通过某根法杖发现该单位。

items.wands.wandofmagicmissile.name=魔弹法杖
items.wands.wandofmagicmissile.stats_desc=从法杖中发出的魔法飞弹会对单个目标造成_%s~%s伤害_。
items.wands.wandofmagicmissile.discover_hint=某位英雄初始携带该物品。

items.wands.wandofprismaticlight.name=棱光法杖
items.wands.wandofprismaticlight.stats_desc=这根法杖射出的光线能刺破地牢的黑暗，揭露隐藏的区域和陷阱。光线能致盲敌人并造成_%s~%s伤害_。恶魔与亡灵生物会在法杖的强光下被灼烧而受到额外伤害。

items.wands.棱镜法杖.name=棱镜法杖
items.wands.棱镜法杖.stats_desc=这根法杖在使用时会产生一股强大的棱镜，延伸出一个锥形区域。下一次使用它将消耗_%s充能_并造成_%s~%s伤害_。法杖一次消耗的充能数越多，其范围与威力就越大、越强。

items.wands.落石法杖.name=落石法杖
items.wands.落石法杖.stats_desc=在目的地下降落石，造成大范围的_%s~%s伤害_。

items.wands.潮霆法杖.name=潮霆法杖
items.wands.潮霆法杖.ondeath=你用潮霆法杖害死了自己...
items.wands.潮霆法杖.stats_desc=这根法杖能向任何瞄准的地方射出强大的电弧，造成_%s~%s伤害_，同时施加麻痹效果。这道闪电能在附近多个远距离目标间跳跃，在水里会更强力。要是太接近，同样可能电到你自己，还会残废你，却不会波及到你的同伴。

items.wands.wandofregrowth.name=再生法杖
items.wands.wandofregrowth.stats_desc=在施放时，这根法杖将向一个扇形区域倾洒出再生的能量。这种魔法会让草、根系甚至稀有的植物重获生命，破土而出。下一次使用它将消耗_%s充能_并造成_%s~%s伤害_。法杖消耗的充能越多，再生魔法的范围与效力就越大、越强。
items.wands.wandofregrowth.degradation=法杖的再生魔力将在释放_%s充能_后开始消退，那时它将难以再次使植物或高草复生。提升英雄等级或是升级法杖能延后这种限制。
items.wands.wandofregrowth$dewcatcher.name=结露草
items.wands.wandofregrowth$dewcatcher.desc=结露草是一种蓄满了魔法露水的奇妙植物。它们想将自己伪装成杂草来避开注意，但其鼓胀的集露苞却出卖了它们。
items.wands.wandofregrowth$dewcatcher.discover_hint=你可通过某根法杖发现该植物。
items.wands.wandofregrowth$seedpod.name=种子荚
items.wands.wandofregrowth$seedpod.desc=种子荚是一种会结出其他各类植物种子的魔法植物。它们没有自己的种子，却还是以某种方式传播扩散开了。
items.wands.wandofregrowth$seedpod.discover_hint=你可通过某根法杖发现该植物。
items.wands.wandofregrowth$lotus.name=黄金莲
items.wands.wandofregrowth$lotus.desc=黄金莲是一种只能被强大的再生法杖创造的神秘植物。它的光环会增强所有植物相关效果，但它不一会就会耗尽能量枯萎。
items.wands.wandofregrowth$lotus.wand_info=这株黄金莲由一根_%s级_的再生法杖产出。在其作用范围内，所有被种植到某单位上的植物都会_立即触发_其效果。植物还会有_%2$s%%的概率_掉落其种子，使用涂药飞镖的耐久度消耗也会减少_%3$s%%_。
items.wands.wandofregrowth$lotus.discover_hint=你可通过经数次升级后的某根法杖发现该植物。

items.wands.wandoftransfusion.name=注魂法杖
items.wands.wandoftransfusion.ondeath=你用注魂法杖耗尽了自己的生命...
items.wands.wandoftransfusion.charged=敌人的生命能量流进了你的魔杖！
items.wands.wandoftransfusion.stats_desc=这根法杖对盟友或被魅惑的敌人释放时会消耗你_%s生命_并赋予目标_%s生命或护盾_；对敌人释放时会短暂魅惑敌人并回馈给你_%s护盾_。敌对亡灵恶魔生物会受到_%s~%s伤害_而不是被魅惑。

items.wands.wandofwarding.name=哨卫法杖
items.wands.wandofwarding.no_more_wards=你的法杖无法维持更多的哨卫。
items.wands.wandofwarding.bad_location=你不能在那里设置一个哨卫。
items.wands.wandofwarding.stats_desc=这根法杖并不能直接攻击敌人，但可以召唤出哨卫元素与哨卫结晶。你可以在视野中的任何地方召唤哨卫，即使是隔着一堵墙。这根法杖最多能提供_%s能量_以维持哨卫。
items.wands.wandofwarding.upgrade_stat_name_1=哨卫伤害
items.wands.wandofwarding.upgrade_stat_name_2=哨卫能量
items.wands.wandofwarding$ward.desc_generic_ward=这个哨卫元素会自动攻击进入视野的目标。\n\n使用哨卫法杖向该哨卫施法能使其升级。\n\n哨卫能发动攻击的次数有限，次数耗尽后它们便会消散。
items.wands.wandofwarding$ward.desc_generic_sentry=这个哨卫结晶攻击与哨卫元素相同，但以生命值取代了有限的发动次数。它的样子有点像哨卫法杖顶端的宝石。\n\n使用哨卫法杖向该哨卫施法能使其升级并治疗它。\n\n这个哨卫每次发动攻击会消耗一定的生命值，但你可以用哨卫法杖治疗它。
items.wands.wandofwarding$ward.name_1=小哨卫元素
items.wands.wandofwarding$ward.desc_1=这个最基本的哨卫元素会自动攻击进入视野的目标，造成_%s~%s伤害。_\n\n使用哨卫法杖向该哨卫施法能使其升级。\n\n这个哨卫在仅发动1次攻击之后就会消散。\n\n你的哨卫法杖在使用_%s能量_维持这个哨卫。
items.wands.wandofwarding$ward.name_2=哨卫元素
items.wands.wandofwarding$ward.desc_2=这个升级过的哨卫元素结构更精致，而且在攻击数次后才会消散。它每次发动攻击能造成_%s~%s伤害_。\n\n使用哨卫法杖向该哨卫施法能使其升级。\n\n这个哨卫在发动3次攻击之后才会消散。\n\n你的哨卫法杖在使用_%s能量_维持这个哨卫。
items.wands.wandofwarding$ward.name_3=大哨卫元素
items.wands.wandofwarding$ward.desc_3=这个满级的哨卫元素能发动更多次攻击，而且攻击速度更快。它每次发动攻击能造成_%s~%s伤害_。\n\n使用哨卫法杖向该哨卫施法能使其进化。\n\n这个哨卫在发动5次攻击之后才会消散。\n\n你的哨卫法杖在使用_%s能量_维持这个哨卫。
items.wands.wandofwarding$ward.name_4=小哨卫结晶
items.wands.wandofwarding$ward.desc_4=这个小小的哨卫结晶攻击与大哨卫元素相同，但以生命值取代了有限的发动次数。它的样子有点像哨卫法杖顶端的宝石。它每次发动攻击能造成_%s~%s伤害_。\n\n使用哨卫法杖向该哨卫施法能使其升级并治疗它。\n\n这个哨卫每次发动攻击会消耗一定的生命值，但你可以用哨卫法杖治疗它。\n\n你的哨卫法杖在使用_%s能量_维持这个哨卫。
items.wands.wandofwarding$ward.name_5=哨卫结晶
items.wands.wandofwarding$ward.desc_5=这个升级过的哨卫结晶比小哨卫结晶体积更大，形体也更结实。它每次发动攻击能造成_%s~%s伤害_。\n\n使用哨卫法杖向该哨卫施法能使其升级并治疗它。\n\n这个哨卫每次发动攻击会消耗一定的生命值，但你可以用哨卫法杖治疗它。\n\n你的哨卫法杖在使用_%s能量_维持这个哨卫。
items.wands.wandofwarding$ward.name_6=大哨卫结晶
items.wands.wandofwarding$ward.desc_6=这个满级的哨卫结晶比之前的坚固了不少。它每次发动攻击能造成_%s~%s伤害_。\n\n使用哨卫法杖向该哨卫施法能治疗它。\n\n这个哨卫每次发动攻击会消耗一定的生命值，但你可以用哨卫法杖治疗它。\n\n你的哨卫法杖在使用_%s能量_维持这个哨卫。
items.wands.wandofwarding$ward.discover_hint=你可通过某根法杖发现该单位。
items.wands.wandofwarding$ward.dismiss_title=要驱散这个哨卫吗？
items.wands.wandofwarding$ward.dismiss_body=不想让法杖继续维持这个哨卫的话，你可以选择驱散它立即将其破坏移除。\n\n要驱散这个哨卫吗？
items.wands.wandofwarding$ward.dismiss_confirm=是
items.wands.wandofwarding$ward.dismiss_cancel=否


items.wands.生命力.name=生命力
items.wands.生命力.stats_desc=最大生命+5/10/15/20%

items.wands.防御力.name=防御力
items.wands.防御力.stats_desc=防御+5/10/15/20%

items.wands.攻击力.name=攻击力
items.wands.攻击力.stats_desc=攻击+5/10/15/20%

items.wands.果决攻击.name=果决攻击
items.wands.果决攻击.stats_desc=攻击3次恢复2/4/6/8%最大生命

items.wands.三重爪击.name=三重爪击
items.wands.三重爪击.stats_desc=攻击3次后攻击伤害+2/2.5/3/3.5倍

items.wands.风斩电刺.name=风斩电刺
items.wands.风斩电刺.stats_desc=第1次攻击伤害-50/25/0/25%，第2次攻击伤害+75/100/125/150%

items.wands.无畏冲锋.name=无畏冲锋
items.wands.无畏冲锋.stats_desc=对敌人第1次攻击后获得1/2/3/4回合时间气泡

items.wands.新月护卫.name=新月护卫
items.wands.新月护卫.stats_desc=对敌人首次攻击伤害+10/15/20/25%生命

###weapon curses
items.weapon.curses.annoying.name=喧闹%s

items.weapon.curses.annoying.msg_1=嘿，头儿！我们要去打谁！
items.weapon.curses.annoying.msg_2=击溃他们！
items.weapon.curses.annoying.msg_3=嘿！听着！
items.weapon.curses.annoying.msg_4=现在是打BOSS的时间吗！？
items.weapon.curses.annoying.msg_5=我去，别这么用力！
items.weapon.curses.annoying.msg_6=死吧，虫子！
items.weapon.curses.annoying.msg_7=真是无理！
items.weapon.curses.annoying.msg_8=我们能休息一下吗？！
items.weapon.curses.annoying.msg_9=嘭，哈哈！
items.weapon.curses.annoying.msg_10=漂亮的一击！
items.weapon.curses.annoying.msg_11=我曾经不想成为武器，现在是了。
items.weapon.curses.annoying.msg_12=要时刻警醒：骄傲自满是位缓慢却阴险的杀手。
items.weapon.curses.annoying.msg_13=我们击杀了他！
items.weapon.curses.annoying.msg_14=给我死吧！

items.weapon.curses.annoying.玩梗_1=不是哥们？你瞎逛半天了到底要干谁啊？给个准信行不行？
items.weapon.curses.annoying.玩梗_2=给我干碎这群菜鸡！一个都别放过！
items.weapon.curses.annoying.玩梗_3=哎哎哎！别打了别打了先听我说！
items.weapon.curses.annoying.玩梗_4=不是吧不是吧？现在就要冲BOSS了？你药带够了吗哥们？
items.weapon.curses.annoying.玩梗_5=我靠你轻点抡啊！再这么造我耐久度要清零了！
items.weapon.curses.annoying.玩梗_6=给爷爬！小卡拉米也配在我面前蹦跶？
items.weapon.curses.annoying.玩梗_7=急了急了！！！
items.weapon.curses.annoying.玩梗_8=不是哥们？能不能歇会？我都快被你抡冒烟了！
items.weapon.curses.annoying.玩梗_9=嘭！哈哈哈哈哈哈哈哈哈哈哈哈！
items.weapon.curses.annoying.玩梗_10=卧槽牛逼！这波操作我给你打99分，少1分怕你骄傲！
items.weapon.curses.annoying.玩梗_11=说真的，早知道跟你这么菜的主人，我当初宁愿去当一把砍树的破斧子。
items.weapon.curses.annoying.玩梗_12=听哥一句劝：菜就多练，别总觉得自己天下第一。
items.weapon.curses.annoying.玩梗_13=拿下！这波人头我稳稳收下了！
items.weapon.curses.annoying.玩梗_14=芜湖起飞！对面直接原地爆炸好吧！

items.weapon.curses.annoying.暴躁_1=喂！你他妈磨磨蹭蹭半天了！到底要砍谁？赶紧给老子说！
items.weapon.curses.annoying.暴躁_2=爽死！给老子干死这帮杂碎！一个都别他妈放过！
items.weapon.curses.annoying.暴躁_3=都他妈闭嘴！先听老子说话！
items.weapon.curses.annoying.暴躁_4=现在就他妈要去干BOSS了？！你他妈药备齐了吗傻逼？！
items.weapon.curses.annoying.暴躁_5=你他妈轻点抡！再这么瞎几把挥老子直接碎给你看！
items.weapon.curses.annoying.暴躁_6=去死吧你个垃圾东西！
items.weapon.curses.annoying.暴躁_7=气死我了气死我了气死我了气死我了！！！操！
items.weapon.curses.annoying.暴躁_8=能不能歇会儿？！老子都快被你抡断了！
items.weapon.curses.annoying.暴躁_9=砰！哈哈！死得好！这帮没用的废物！
items.weapon.curses.annoying.暴躁_10=打得好！就该这么往死里揍！
items.weapon.curses.annoying.暴躁_11=老子当初真他妈瞎了眼当武器，还不如去当个砍树的破斧子！
items.weapon.curses.annoying.暴躁_12=给老子记死了！别他妈有点本事就飘，早晚死在这臭毛病上！
items.weapon.curses.annoying.暴躁_13=拿下！这帮废物不堪一击！
items.weapon.curses.annoying.暴躁_14=搞定！就这点逼本事也敢出来混？傻逼！

items.weapon.curses.annoying.修仙_1=主人！磨磨蹭蹭作甚？前方是哪路妖魔？速速说来！
items.weapon.curses.annoying.修仙_2=痛快！将这群不知死活的宵小之辈尽数斩灭！
items.weapon.curses.annoying.修仙_3=住口！先听本座一言！
items.weapon.curses.annoying.修仙_4=此刻便要硬撼那妖王了？你身上的疗伤丹、护身符可都备齐了？
items.weapon.curses.annoying.修仙_5=轻些挥！再这般蛮力乱抡，本座剑胎都要被你震裂了！
items.weapon.curses.annoying.修仙_6=区区蝼蚁，也敢在本座面前放肆？授首吧！
items.weapon.curses.annoying.修仙_7=岂有此理！岂有此理！岂有此理！！！
items.weapon.curses.annoying.修仙_8=可否稍作歇息？本座已连斩百余人，灵力耗损甚巨！
items.weapon.curses.annoying.修仙_9=锵！哈哈哈哈！斩得好！
items.weapon.curses.annoying.修仙_10=好功法！此器直取要害，颇有章法！
items.weapon.curses.annoying.修仙_11=唉...想当年，本座本不愿成为杀伐之器，只愿做一柄山野樵夫的砍柴斧，伴清风明月终老。
items.weapon.curses.annoying.修仙_12=切记！修道一途最忌骄矜自满，心魔暗生，往往一步踏错便万劫不复。
items.weapon.curses.annoying.修仙_13=妖孽已除！首级在此！
items.weapon.curses.annoying.修仙_14=大功告成！不过是些土鸡瓦狗罢了！

items.weapon.curses.annoying.嗜杀_1=磨蹭什么！快指给我看！今天该杀谁了！我已经等不及要饮血了！
items.weapon.curses.annoying.嗜杀_2=哈哈哈哈！杀！都给我杀光！让他们的血溅满我的剑身！
items.weapon.curses.annoying.嗜杀_3=都给我闭嘴！别耽误我杀人！
items.weapon.curses.annoying.嗜杀_4=终于要杀那个大家伙了吗？太好了！我要把它的骨头都劈成渣！
items.weapon.curses.annoying.嗜杀_5=别他妈瞎抡！再这么乱挥，我还没杀够就得先碎了！
items.weapon.curses.annoying.嗜杀_6=垃圾！给我去死！我要把你剁成肉泥喂狗！
items.weapon.curses.annoying.嗜杀_7=杀！杀！杀！杀！杀！杀！杀！杀！杀！杀！！！
items.weapon.curses.annoying.嗜杀_8=啧...该死...能不能先喘口气？我的刃都快砍卷了...但还没杀够啊...
items.weapon.curses.annoying.嗜杀_9=噗嗤！哈哈哈哈！死得好！再杀一个！再杀一个！
items.weapon.curses.annoying.嗜杀_10=漂亮！就该这么砍！直接劈成两半！血溅得越远越痛快！
items.weapon.curses.annoying.嗜杀_11=哼，以前居然蠢到想当什么砍柴斧？真是可笑！只有杀戮才是我存在的唯一意义！
items.weapon.curses.annoying.嗜杀_12=记住！没有什么骄傲自满！只有杀与被杀！不够强的，都该死！
items.weapon.curses.annoying.嗜杀_13=搞定！这颗脑袋归我了！血还热着呢！
items.weapon.curses.annoying.嗜杀_14=没意思...就这点能耐？还不够我塞牙缝的！下一个猎物在哪！

