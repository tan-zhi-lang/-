items.potions.elixirs.暴刹秘药.name=暴刹秘药
items.potions.elixirs.暴刹秘药.desc=你的连杀状态回合最大永久+10，但是你脱离连杀状态会每回合受到5%生命伤害，且连杀状态+5%吸血和15%攻击(每次饮用永久叠加)。

items.potions.elixirs.elixiroftoxicessence.name=毒粹秘药
items.potions.elixirs.elixiroftoxicessence.desc=50回合内毒素之力(免疫中毒和毒气，每回合生成1格范围(每格6元素)毒气)。



