items.potions.elixirs.永生秘药.desc=恢复所有生命值、饥饿值，消除已装备物品的诅咒。也可以消耗一瓶来_祝福_重生十字架。

items.potions.elixirs.elixirofhoneyedhealing.name=圣愈蜜药
items.potions.elixirs.elixirofhoneyedhealing.desc=治疗药剂的效果(投掷金色蜜蜂还能使其平静下来)。并额外填充150饥饿。

items.potions.elixirs.elixiroficytouch.name=晶触秘药
items.potions.elixirs.elixiroficytouch.desc=获得50回合晶触之力(免疫冻僵和冻结，攻击施加2回合冻僵)。

items.potions.elixirs.根骨秘药.name=根骨秘药
