plants.blandfruitbush.name=无味果
plants.blandfruitbush.desc=腐莓的远亲，来自无味果树丛的梨状产物，尝起来犹如一团泥巴。果实粗糙且松软，但并没有毒性。也许可以煮食。
plants.blandfruitbush.discover_hint=这种植物有几率在地牢中生成。
plants.blandfruitbush$seed.name=无味果种子

plants.blindweed.name=致盲草
plants.blindweed.desc=踩踏获得10回合失明和残废。
plants.blindweed.warden_desc=你踩踏不再获得失明和残废，而是10回合隐形。
plants.blindweed$seed.name=致盲草种子

plants.mageroyal.name=魔皇草
plants.mageroyal.refreshed=目标感觉浑身清爽。
plants.mageroyal.desc=踩踏消除常见负面效果。
plants.mageroyal.warden_desc=踩踏获得10回合净化。
plants.mageroyal$seed.name=魔皇草种子

plants.earthroot.name=地缚根
plants.earthroot.desc=踩踏获得最大生命的植被护甲(每次能吸收地牢层数/2+2.5伤害)。
plants.earthroot.warden_desc=你踩踏获得等级+5的树皮，每5回合衰减1。
plants.earthroot$seed.name=地缚根种子
plants.earthroot$armor.name=植被护甲
plants.earthroot$armor.desc=这是一种由层层树皮和藤蔓盘结而成的，不可移动的天然护甲。\n\n每当你受到攻击，植被护甲都会吸收%s点伤害，直到其耐久被耗尽并瓦解。\n\n该护甲是不可移动的，所以一旦你离开原位护甲便会被破坏，消失不见。\n\n剩余护甲量：%s点

plants.fadeleaf.name=消逝草
plants.fadeleaf.desc=踩踏随机传送。
plants.fadeleaf.warden_desc=你踩踏返回上一层。
plants.fadeleaf$seed.name=消逝草种子

plants.firebloom.name=烈焰花
plants.firebloom.desc=踩踏生成2元素火焰。
plants.firebloom.warden_desc=踩踏获得15回合烈焰之力。
plants.firebloom$seed.name=烈焰花种子

plants.icecap.name=冰冠花
plants.icecap.desc=踩踏1格范围内冻结。
plants.icecap.warden_desc=踩踏获得15回合晶触之力。
plants.icecap$seed.name=冰冠花种子

plants.plant.warden_desc=守望者踩踏这株植物不会获得额外效果。
plants.plant.discover_hint=这种植物和它的种子有几率在地牢中生成。
plants.plant$seed.seed_of=%s种子
plants.plant$seed.ac_throw=丢子(植)
plants.plant$seed.ac_plant=(植)自用
plants.plant$seed.info=把这粒种子种到你想长出一株植物的地方。\n\n%s
plants.plant$seed$placeholder.name=种子

plants.rotberry.name=腐莓
plants.rotberry.desc=未成熟的腐莓丛结出的莓果尝起来更像是甜蜜的死亡。经过成年累月的生长，这株腐莓丛终会成熟为另一棵腐莓核心。被踩踏后，这株未成熟的腐莓会释放少量毒气。
plants.rotberry.warden_desc=你踩踏获得200回合激素涌动，期间力量+1。
plants.rotberry.discover_hint=这种植物的种子将在某个特殊任务中出现。
plants.rotberry$seed.name=腐莓种子
plants.rotberry$seed.discover_hint=这件物品将在某个特殊任务中出现。

plants.sorrowmoss.name=断肠苔
plants.sorrowmoss.desc=踩踏获得5+地牢层数x2/3的中毒。
plants.sorrowmoss.warden_desc=你踩踏获得15回合毒素之力。
plants.sorrowmoss$seed.name=断肠苔种子

plants.starflower.name=星陨花
plants.starflower.desc=踩踏获得30回合祝福。
plants.starflower.warden_desc=踩踏获得30回合充能。
plants.starflower$seed.name=星陨花种子

plants.stormvine.name=风暴藤
plants.stormvine.desc=踩踏获得10回合眩晕。
plants.stormvine.warden_desc=你踩踏不再获得眩晕，而是10回合浮空。
plants.stormvine$seed.name=风暴藤种子

plants.sungrass.name=阳春草
plants.sungrass.desc=踩踏每回合恢复(40+最大生命)/150，期间不能移动。
plants.sungrass.warden_desc=期间可以移动。
plants.sungrass$seed.name=阳春草种子
plants.sungrass$health.name=草药疗养
plants.sungrass$health.desc=阳春草拥有优秀的治疗能力，尽管治疗速率比治疗药剂慢很多。\n\n脱离植株将会打断治疗效果。\n\n剩余治疗量：%d

plants.swiftthistle.name=速行蓟
plants.swiftthistle.desc=踩踏获得5回合时间气泡
plants.swiftthistle.warden_desc=踩踏额外获得1回合极速。
plants.swiftthistle$seed.name=速行蓟种子
plants.swiftthistle$timebubble.name=时间气泡
plants.swiftthistle$timebubble.desc=这是一个加速时间运行的气泡。\n\n你可以在气泡中瞬间进行多次行动，但是攻击或施法都会打断这个效果。\n\n剩余时长：%s回合
